name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  schema-ts:
    name: schema (TypeScript) / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/econte
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: packages/econte/package-lock.json
      - run: npm install
      - run: npm run build:schema
      - run: npm test
      - run: npm run lint

  cli-python:
    name: cli (Python) / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: ruff check .
      - run: mypy econte

  cross-language-consistency:
    name: schema cross-check (TS ⇄ Python golden fixtures)
    needs: [schema-ts, cli-python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm install
        working-directory: packages/econte
      - run: pip install -e ".[dev]"
        working-directory: python
      - name: Validate every golden fixture with both implementations, compare verdicts
        run: python scripts/cross_check_goldens.py
