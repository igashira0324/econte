[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "econte"
version = "0.1.0"
description = "Storyboard schema (pydantic mirror) and CLI for the econte AI video pipeline"
readme = "econte/README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "econte contributors" }]
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "types-PyYAML",
]

[project.scripts]
econte = "econte.cli:main"

[tool.setuptools.packages.find]
include = ["econte*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_return_any = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
